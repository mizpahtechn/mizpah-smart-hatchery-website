<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075b28">
  <meta name="robots" content="noindex,nofollow">
  <title>You're offline | Mizpah Technology</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Arial,Helvetica,sans-serif;color:#17271d;background:#fff}
    main{width:min(100%,520px);text-align:center;border:1px solid #e2e9e1;
      border-top:5px solid #d4af37;border-radius:14px;padding:36px 28px;
      box-shadow:0 12px 35px rgba(7,91,40,.08)}
    h1{margin:0 0 12px;color:#075b28;font-size:clamp(25px,6vw,34px)}
    p{line-height:1.65;color:#526257}
    button{margin-top:12px;border:0;border-radius:8px;padding:13px 22px;
      background:#075b28;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Mizpah Technology</h1>
    <p>You're currently offline. Please reconnect to the internet to view current products, prices, stock availability, submit orders or make payments.</p>
    <p>Your live catalogue and account information have not been replaced with saved or outdated data.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
