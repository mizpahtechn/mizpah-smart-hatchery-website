name: Knowledge Center commerce checks

on:
  push:
    branches:
      - feature/knowledge-center-digital-commerce
    paths:
      - ".github/scripts/**"
      - ".github/workflows/knowledge-center-commerce-check.yml"
      - "digital-library.html"
      - "academy.html"
      - "knowledge-product.html"
      - "knowledge-checkout.html"
      - "knowledge-library.html"
      - "academy-course.html"
      - "admin/knowledge-center.html"
      - "supabase/functions/knowledge-center-commerce/**"
      - "supabase/functions/website-checkout/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/knowledge-center-commerce-check.yml"
      - "digital-library.html"
      - "academy.html"
      - "knowledge-product.html"
      - "knowledge-checkout.html"
      - "knowledge-library.html"
      - "academy-course.html"
      - "admin/knowledge-center.html"
      - "supabase/functions/knowledge-center-commerce/**"
      - "supabase/functions/website-checkout/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Knowledge Center commerce function
        run: deno check supabase/functions/knowledge-center-commerce/index.ts
      - name: Run payment provider helper tests
        run: deno test supabase/functions/knowledge-center-commerce/provider_helpers_test.ts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax in Knowledge Center pages
        run: node .github/scripts/check-inline-js.mjs

  database-migration-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare disposable Supabase-like schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d kc_test -v ON_ERROR_STOP=1 -f supabase/tests/knowledge_center_migration_fixture.sql
      - name: Apply Knowledge Center migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d kc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261127120000_knowledge_center_digital_commerce_phase1.sql
      - name: Run RLS, grants and private-storage smoke tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d kc_test -v ON_ERROR_STOP=1 -f supabase/tests/knowledge_center_migration_smoke.sql
